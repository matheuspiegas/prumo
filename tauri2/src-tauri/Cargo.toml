[package]
name = "prumo"
version = "0.1.0"
description = "Prumo - tarefas do dia"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tarefas-core = { path = "../../core" }
tauri-plugin-dialog = "2.8.4"
# ATENÇÃO: o Cargo.lock fixa ort = 2.0.0-rc.12. O transcribe-rs 0.3.12 não compila com ort rc.15+
# (rode `cargo update -p ort --precise 2.0.0-rc.12` se o lock for regenerado).
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
cpal = "0.18.2"
chrono = "0.4.45"
tauri-plugin-global-shortcut = "2.4.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
