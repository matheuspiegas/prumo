name: Build Windows

# Roda em pushes/merges na main, em pull requests para a main e manualmente
# (aba Actions > Build Windows > Run workflow). Mudanças só de documentação não disparam.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes rápidos (Linux): core e cli em Rust e checagem de tipos do frontend.
  # Rodam em paralelo com o build do Windows, que é bem mais lento.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri2/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            cli

      - name: Testes do core
        working-directory: core
        run: cargo test

      - name: Testes do cli e do servidor MCP
        working-directory: cli
        run: cargo test

      - name: Checagem de tipos do frontend
        working-directory: tauri2
        run: |
          npm ci
          npx tsc --noEmit

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri2/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Compartilha o cache de compilação do Rust entre execuções.
      - uses: swatinem/rust-cache@v2
        with:
          # O cli/ é compilado pelo `beforeBuildCommand` (npm run prepare-cli:release) como sidecar.
          workspaces: |
            tauri2/src-tauri
            cli
          # Muda a chave quando a configuração do ggml muda, para não reaproveitar um build antigo.
          key: ggml-native-off

      - name: Instalar dependências do frontend
        working-directory: tauri2
        run: npm ci

      # Gera os instaladores (NSIS .exe e MSI) e os anexa à execução como artefatos.
      # Sem tagName/releaseId a action não cria release nenhuma.
      - uses: tauri-apps/tauri-action@v1
        env:
          # Sem isto o ggml é otimizado para a CPU do servidor de build (que costuma ter AVX-512) e
          # o app cai com "instrução ilegal" em CPUs que não têm essas instruções. NATIVE=OFF usa um
          # piso portátil (AVX2), como o crate já faz no macOS.
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
        with:
          projectPath: tauri2
          # Liga o motor ggml (Whisper .bin e .gguf, como no Handy). Compila C++ com CMake,
          # que já vem na imagem windows-latest.
          args: --features ggml
          uploadWorkflowArtifacts: true
