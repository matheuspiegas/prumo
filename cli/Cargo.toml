[package]
name = "prumo-cli"
version = "0.1.0"
edition = "2024"
description = "CLI e servidor MCP do Prumo"

[lib]
name = "prumo_cli"
path = "src/lib.rs"

[[bin]]
name = "prumo-cli"
path = "src/main.rs"

[dependencies]
tarefas-core = { path = "../core" }
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
rusqlite = "0.41.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
